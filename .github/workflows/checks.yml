name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - run: npm run setup
      - run: npm run verify
      - run: npm audit --audit-level=moderate
        working-directory: frontend
